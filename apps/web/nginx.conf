# Configuration nginx pour servir le front en production.
#
# nginx fait DEUX choses ici : il sert les fichiers du front, et il relaie les
# appels d'API vers le conteneur `api`. Tout passe donc par une seule adresse.
#
# Pourquoi c'est important, et pas juste « plus propre » :
#
#  • Le React s'exécute dans le navigateur du VISITEUR. Une adresse d'API
#    écrite en dur dans le bundle (« http://localhost:8080 ») désignerait la
#    machine du visiteur, pas le serveur. Avec ce relais, le front appelle
#    « /api/… » — sa propre origine, quelle qu'elle soit. Le même bundle
#    fonctionne donc depuis n'importe quelle adresse, sans être reconstruit.
#  • Une seule origine = pas de CORS à configurer, un seul port à ouvrir, et
#    plus tard un seul certificat HTTPS.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Les appels d'API partent vers le conteneur `api`, joint par son NOM de
    # service sur le réseau interne Docker (port 8080 interne, jamais publié).
    #
    # Le / final de proxy_pass est significatif : sans lui, nginx concatènerait
    # le chemin et l'API recevrait « /api/api/novels ».
    location /api/ {
        # `resolver` + adresse dans une VARIABLE : sans ça, nginx résout le nom
        # « api » AU DÉMARRAGE et REFUSE de démarrer s'il ne le trouve pas
        # (« host not found in upstream »). Le front entier tomberait donc parce
        # que l'API n'est pas encore prête. Avec une variable, la résolution est
        # reportée à chaque requête : nginx démarre toujours, et l'API est jointe
        # dès qu'elle répond. 127.0.0.11 est le résolveur DNS interne de Docker.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les couvertures et avatars sont servis par l'API ; certains fichiers
        # peuvent être gros, on laisse le temps de les transmettre.
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Les images téléversées (couvertures, avatars, bannières) : même relais.
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $uploads_upstream http://api:8080;
        proxy_pass $uploads_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # SPA fallback : pour une Single Page App, toute URL inconnue doit
    # renvoyer index.html (c'est React Router qui gérera la route côté client).
    # Indispensable dès qu'on aura plusieurs pages (/novels/:id, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

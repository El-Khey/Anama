spring:
  application:
    name: novelrealm-api

  # ── Connexion à la base PostgreSQL ──────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/novelrealm
    username: ${DB_USER:novelrealm}
    password: ${DB_PASSWORD:novelrealm}

  # ── JPA / Hibernate (la couche objet ↔ base) ───────────────────
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

  # ── Upload de fichiers (avatars, bannières) ────────────────────
  # Limite « transport » du multipart ; les limites métier (2 Mo avatar,
  # 4 Mo bannière) sont vérifiées dans FileStorageService.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Envoi d'emails (SMTP Gmail) ────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Connexion Google (OAuth2) ──────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# ── Configuration applicative ───────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Dossier disque des uploads (relatif au dossier de travail de l'app).
  upload-dir: ${UPLOAD_DIR:uploads}

  # ── Administration ─────────────────────────────────────────────
  # Emails autorisés à déclencher l'ingestion (séparés par des virgules).
  # VIDE = personne (fail-closed). Mécanisme d'intérim faute de rôles ;
  # voir AdminGuard et docs/INGESTION_V2.md.
  admin-emails: ${ADMIN_EMAILS:}

  # ── Authentification JWT (mobile + web) ────────────────────────
  # Un seul token signé (HS256) : header `Authorization: Bearer` côté mobile,
  # cookie httpOnly côté web. Le secret DOIT faire ≥ 32 octets (256 bits).
  #
  # Renouvellement GLISSANT (issue #45, §1) : passé la moitié de sa vie, un
  # token est ré-émis silencieusement à la prochaine requête. La durée
  # ci-dessous n'est donc PAS « la session dure 7 jours » mais « 7 jours
  # d'inactivité complète déconnectent » — un utilisateur actif reste
  # connecté indéfiniment.
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-min-32-bytes-long!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:604800}  # 7 jours d'inactivité tolérée
    cookie-name: ${JWT_COOKIE_NAME:access_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}             # true en prod (HTTPS)
    cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}          # None en prod (domaines ≠)

  # ── GIF dans les commentaires (issue #45, §5) ──────────────────
  # L'app ne parle JAMAIS au fournisseur directement : l'API fait proxy, la
  # clé reste côté serveur. Sans clé (KLIPY_API_KEY absent du .env), la
  # fonctionnalité est simplement désactivée — l'app masque le bouton GIF,
  # tout le reste fonctionne. Clé gratuite : partner.klipy.com.
  #
  # Ce service visait Tenor jusqu'à ce que Google ferme son API aux
  # développeurs (inscriptions closes le 13/01/2026, arrêt le 30/06/2026).
  klipy:
    api-key: ${KLIPY_API_KEY:}
    base-url: https://api.klipy.com/api/v1

# ── Ingestion V2 (miroir chikari.moe) ───────────────────────────
# Job planifié qui rapatrie et maintient les light novels depuis l'API
# JSON de chikari (/api/novels/*). Voir docs/INGESTION_V2.md.
novelrealm:
  ingestion:
    enabled: ${INGESTION_ENABLED:true}          # coupe-circuit global
    cron: ${INGESTION_CRON:0 0 3 * * *}          # 03:00 quotidien
    delay-ms: ${INGESTION_DELAY_MS:500}          # politesse entre chapitres
    catalog-page-size: ${INGESTION_CATALOG_PAGE_SIZE:24}
    discovery-cap: ${INGESTION_DISCOVERY_CAP:100} # débit du miroir : nouveaux titres/run
    skip-nsfw: ${INGESTION_SKIP_NSFW:true}       # la découverte saute l'adulte
    max-retries: ${INGESTION_MAX_RETRIES:3}      # tentatives sur 429/5xx/timeout
    source:
      base-url: ${INGESTION_SOURCE_BASE_URL:https://chikari.moe}
      user-agent: ${INGESTION_SOURCE_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36}

server:
  port: 8080

logging:
  level:
    "[org.hibernate.SQL]": debug